<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color:lightblue;
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
}

#parent{
height:260px;
width:220px;
display:flex;
flex-direction:column;
justify-content:space-evenly;
align-items:center;
background-color:white;
border-radius:8px;
box-shadow:0 0 10px gray;
padding:15px;
}

form{
display:flex;
flex-direction:column;
justify-content:space-evenly;
height:100%;
width:100%;
align-items:center;
}

input{
height:30px;
width:90%;
border-radius:5px;
padding:5px;
}

button{
width:100%;
height:35px;
background-color:blue;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background-color:darkblue;
}

h2{
margin:0;
}

</style>
</head>

<body>

<div id="parent">

<form action="login.html">

<h2>Login</h2>

<input type="text" placeholder="Username">
<input type="password" placeholder="Password">

<button>Login</button>

<div>Create a new account. <a href="signupForm.html">Signup</a></div>


</form>

</div>

</html>
