<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
        }
        nav{
            height:100px;
           
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: gold;
        }
        #logoblock,#menublock{
            height:90px;
            width:400px;
     
            display: flex;
            justify-content: space-evenly;
            align-items: center;
                
        }
    #logoblock img{
        height: 100px;
        width:200px;
        mix-blend-mode: multiply;
        transition: all 0.5s;
       
    }
    #menublock a{
        padding-bottom: 10px;
        text-decoration: none;
        color: black;
        font-size: 20px;
        font-weight: bold;

    }
    #logoblock img:hover{
        height: 300px;
        width:600px;
        transition: all 5s ease-in-out 1s;
    }
    #menublock a:hover{
        border-bottom: 2px solid white;
        transition: all 0.2s;
    }
    {
        
    }
    </style>
</head>
<body>
    <nav>
    <div id="logoblock"> <img src="https://www.decodedmagazine.com/wp-content/uploads/2021/05/Apple-Music.jpg" alt=""></div>
    <div id="menublock" width="400px">
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Contact</a>
        <a href="">Login</a>

    </div>
    </nav>
</body>
</html>
