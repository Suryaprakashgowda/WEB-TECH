<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./calculator.css">
</head>
<body>
    <di id="super">
    <div id="parent">
        <section>
            <input type="text">
        </section>
        <section >
            <div class="boxes" onclick="plus()">+</div>
            <div class="boxes" onclick="minus()">-</div>
            <div class="boxes" onclick="multiply()">x</div>
            <div class="boxes" onclick="divide()">%</div>

        </section>
        <section>
            <div class="boxes">7</div>
            <div class="boxes">8</div>
            <div class="boxes">9</div>
            <div class="boxes">4</div>

        </section>
        <section >
            <div class="boxes">5</div>
            <div class="boxes">6</div>
            <div class="boxes">1</div>
            <div class="boxes">2</div>

        </section>
        <section >
            <div class="boxes">3</div>
            <div class="boxes">0</div>
            <div class="boxes">.</div>
            <div class="boxes">C</div>

        </section>
        <section>
            <article>=</article>
        </section>
    </div>
</div>
<script>
    function plus(){
        let a=Number(prompt('Enter first number'));
        let b=Number(prompt('Enter second number'));
        console.log(`The sum of ${a}+${b} = ${a+b}`);
        
    }
    function minus(){
        let a=prompt('Enter first number');
        let b=prompt('Enter second number');
        console.log(`The difference of ${a}-${b} = ${a-b}`);

    }
    function multiply(){
        let a=prompt('Enter first number');
        let b=prompt('Enter second number');
        console.log(`The product of ${a}*${b} = ${a*b}`);
    }
    function divide(){
            let a=prompt('Enter first number');
            let b=prompt('Enter second number');
            console.log(`The quotient of ${a}/${b} = ${a/b}`);
    }
</script>
</body>
</html>
