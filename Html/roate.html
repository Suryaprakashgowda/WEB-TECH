<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;

        }
        body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        div{
            height: 200px;
            width: 200px;
            background-color: black;
            animation: rote 6s ease-in 0.1s infinite normal;
            transition: all 2s;

        }
        @keyframes rote {
            from{
                transform: rotate(180deg);
            }
            to{
                transform: rotate(360deg) ;
            }

        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
